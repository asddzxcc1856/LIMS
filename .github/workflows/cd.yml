name: CD

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT: tsmc-lims
  AR_REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/tsmc-lims/lims

jobs:
  build-push-and-rollout:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Generate immutable image tag
      # ---------------------------------------------------------
      - name: Generate image tag
        id: tag
        run: |
          echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Authenticate to GCP
      # ---------------------------------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ci-builder@tsmc-lims.iam.gserviceaccount.com

      # ---------------------------------------------------------
      # Setup gcloud + GKE auth plugin
      # ---------------------------------------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # ---------------------------------------------------------
      # Enable GKE auth plugin
      # ---------------------------------------------------------
      - name: Enable GKE auth plugin
        run: |
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Get GKE credentials
      # ---------------------------------------------------------
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials lims-prod-gke \
            --region asia-east1 \
            --project tsmc-lims

      # ---------------------------------------------------------
      # Configure Docker auth
      # ---------------------------------------------------------
      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # ---------------------------------------------------------
      # Build + push backend
      # ---------------------------------------------------------
      - name: Build and push backend
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f backend/Dockerfile.k8s \
            -t "${{ env.REGISTRY }}/backend:$TAG" \
            -t "${{ env.REGISTRY }}/backend:latest" \
            --push \
            backend/

      # ---------------------------------------------------------
      # Build + push frontend
      # ---------------------------------------------------------
      - name: Build and push frontend
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f frontend/Dockerfile.k8s \
            --build-arg VITE_API_BASE=/api \
            -t "${{ env.REGISTRY }}/frontend:$TAG" \
            -t "${{ env.REGISTRY }}/frontend:latest" \
            --push \
            frontend/

      # ---------------------------------------------------------
      # Trivy backend
      # ---------------------------------------------------------
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/backend:${{ steps.tag.outputs.value }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # ---------------------------------------------------------
      # Trivy frontend
      # ---------------------------------------------------------
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/frontend:${{ steps.tag.outputs.value }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # ---------------------------------------------------------
      # Rollout restart
      # ---------------------------------------------------------
      - name: Rollout restart frontend
        run: |
          kubectl rollout restart deployment/lims-prod-lims-frontend -n lims-prod

      - name: Rollout restart backend
        run: |
          kubectl rollout restart deployment/lims-prod-lims-backend -n lims-prod

      # ---------------------------------------------------------
      # Wait rollout complete
      # ---------------------------------------------------------
      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/lims-prod-lims-frontend \
            -n lims-prod \
            --timeout=300s

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/lims-prod-lims-backend \
            -n lims-prod \
            --timeout=300s
